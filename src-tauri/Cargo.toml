[package]
name = "loki_analyzer_app"
version = "2.0.0"
description = "Loki Analyzer - Anti-Cheat and Binary Forensics GUI"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
loki_analyzer = { path = ".." }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"
rfd = "0.15"
webbrowser = "1.0"
tokio = { version = "1", features = ["full"] }
