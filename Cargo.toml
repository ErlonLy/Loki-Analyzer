[package]
name = "loki_analyzer"
version = "2.0.0"
edition = "2021"

[lib]
name = "loki_analyzer"
path = "src/lib.rs"

[[bin]]
name = "loki_analyzer"
path = "src/main.rs"

[dependencies]
goblin = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
rfd = "0.15"
webbrowser = "1.0"
memmap2 = "0.9"
chrono = "0.4"
